name: Build VYRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VYRA ZIP
        run: |
          mkdir -p vyra_project

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: VYRA ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d vyra_project

      - name: Locate Android Project
        run: |
          PROJECT_ROOT=$(find vyra_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_ROOT")

          echo "Android project found at:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build VYRA APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "APK files found:"
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
