name: Build VYRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VYRA ZIP
        run: |
          mkdir -p vyra_project

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: VYRA ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d vyra_project

      - name: Locate Gradle project
        run: |
          ROOT=$(find vyra_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$ROOT")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build VYRA APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        run: |
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
